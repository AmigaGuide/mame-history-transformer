<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}MAME-History-Transformer Preview{% endblock %}</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f5f5;
      }
      header {
        background: #20232a;
        color: #ffffff;
        padding: 0.5rem 1rem;
      }
      header .nav-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header a {
        color: #61dafb;
        text-decoration: none;
        margin: 0 0.25rem;
      }
      header a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 1100px;
        margin: 1rem auto 2rem auto;
        padding: 0 1rem;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2.4fr) minmax(260px, 1fr);
        gap: 1.5rem;
        align-items: flex-start;
      }
      .infobox {
        background: #ffffff;
        border: 1px solid #ccc;
        padding: 0.5rem 0.75rem;
        font-size: 0.9rem;
      }
      .infobox h2 {
        margin-top: 0;
        text-align: center;
      }
      .infobox table {
        width: 100%;
        border-collapse: collapse;
      }
      .infobox th,
      .infobox td {
        border-top: 1px solid #ddd;
        padding: 0.25rem 0.3rem;
        vertical-align: top;
      }
      .infobox th {
        text-align: left;
        width: 40%;
        font-weight: bold;
      }
      .infobox td {
        text-align: left;
      }
      h1 {
        margin-top: 0.4rem;
      }
      .lead {
        font-size: 1rem;
        line-height: 1.5;
      }
      h2 {
        margin-top: 1.5rem;
        border-bottom: 1px solid #ddd;
        padding-bottom: 0.2rem;
      }
      ul, ol {
        margin-top: 0.3rem;
      }
      .ports-block {
        background: #ffffff;
        border: 1px solid #ddd;
        padding: 0.5rem 0.75rem;
        font-family: monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
      }
      .search-form {
        margin-top: 0.3rem;
      }
      .search-results table {
        width: 100%;
        border-collapse: collapse;
      }
      .search-results th,
      .search-results td {
        padding: 0.35rem 0.4rem;
        border-bottom: 1px solid #eee;
        text-align: left;
      }
      .muted {
        color: #666;
        font-size: 0.9rem;
      }
      .summary-block {
        background: #ffffff;
        border: 1px solid #ddd;
        padding: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav-line">
        <div>
          {% block nav_left %}{% endblock nav_left %}
        </div>
        <div>
          <form action="{{ url_for('search') }}" method="get" class="search-form">
            <input type="text" name="q" placeholder="Search by MAME name…" value="{{ request.args.get('q', '') }}">
            <button type="submit">Search</button>
          </form>
        </div>
      </div>
    </header>
    <main>
      {% block content %}{% endblock content %}
    </main>
  </body>
</html>
